name: secret-scan

# Backstop against committed credentials. Fails if a DeepSeek (sk-…) or Brave
# (BSA…) API-key shape appears in tracked files. Keys belong in backend/.env
# (git-ignored) — see SECURITY.md.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for API-key shapes
        run: |
          # Match a real DeepSeek key (sk- followed by 20+ key chars) or a Brave
          # key (BSA followed by 20+ chars). The placeholder "sk-" in .env.example
          # has nothing after it, so it will not match.
          pattern='sk-[A-Za-z0-9]{20,}|BSA[A-Za-z0-9_-]{20,}'
          if git grep -nE "$pattern" -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::Possible API key found in tracked files. Rotate the key and remove it (see SECURITY.md)."
            exit 1
          fi
          echo "No API-key shapes found in tracked files."
